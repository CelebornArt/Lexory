[package]
name = "lexory"
version = "1.0.0"
description = "Lexory - Minimalist multi-language word-memory app"
authors = ["Lexory"]
edition = "2021"

[lib]
name = "lexory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
